name: Daily Market Data Sync

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually with a click anytime

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance requests pandas

      - name: Execute Fetch Script
        run: |
          python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Market-Sync-Bot"
          git config --global user.email "bot@github-actions.local"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
